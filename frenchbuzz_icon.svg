<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>FrenchBuzz Icon - Correct French Flag YouTube Profile</title>
  <desc>FrenchBuzz icon with correct French flag Blue White Red vertical stripes</desc>

  <defs>
    <clipPath id="iconFlagClip">
      <circle cx="200" cy="188" r="130"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <circle cx="200" cy="200" r="195" fill="#1a1a2e"/>
  <circle cx="200" cy="200" r="188" fill="none" stroke="#FFD700" stroke-width="1.5" opacity="0.2"/>

  <!-- White base -->
  <circle cx="200" cy="188" r="130" fill="#ffffff"/>

  <!-- BLUE left stripe -->
  <rect x="70" y="58" width="87" height="260" fill="#002395" clip-path="url(#iconFlagClip)"/>

  <!-- WHITE middle — already white from base -->

  <!-- RED right stripe -->
  <rect x="243" y="58" width="87" height="260" fill="#ED2939" clip-path="url(#iconFlagClip)"/>

  <!-- Dark centre -->
  <circle cx="200" cy="188" r="72" fill="#1a1a2e"/>

  <!-- FR (enlarged since it's now the sole focal element — legible at 48px) -->
  <text x="200" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="62" font-weight="700" fill="#FFD700">FR</text>
</svg>
