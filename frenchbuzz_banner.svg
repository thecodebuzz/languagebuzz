<svg width="2560" height="1440" viewBox="0 0 2560 1440" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>FrenchBuzz YouTube Banner - Correct French Flag</title>
  <desc>FrenchBuzz YouTube banner 2560x1440 with correct French flag Blue White Red</desc>

  <defs>
    <clipPath id="bannerFlagClip">
      <circle cx="520" cy="680" r="360"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="2560" height="1440" fill="#1a1a2e"/>

  <!-- Ghost FR -->
  <text x="1280" y="950" text-anchor="middle" font-family="Arial, sans-serif" font-size="900" font-weight="700" fill="#ffffff" opacity="0.03">FR</text>

  <!-- White base circle -->
  <circle cx="520" cy="680" r="360" fill="#ffffff"/>

  <!-- BLUE left stripe -->
  <rect x="160" y="320" width="240" height="720" fill="#002395" clip-path="url(#bannerFlagClip)"/>

  <!-- WHITE middle — already white -->

  <!-- RED right stripe -->
  <rect x="640" y="320" width="240" height="720" fill="#ED2939" clip-path="url(#bannerFlagClip)"/>

  <!-- Dark centre -->
  <circle cx="520" cy="680" r="200" fill="#1a1a2e"/>
  <text x="520" y="718" text-anchor="middle" font-family="Arial, sans-serif" font-size="150" font-weight="700" fill="#FFD700">FR</text>

  <!-- Gold spark -->
  <polygon points="1650,250 1590,440 1635,440 1575,635 1680,408 1622,408" fill="#FFD700" opacity="0.9"/>

  <!-- Brand name -->
  <text x="1600" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="280" font-weight="700" fill="#ffffff">french</text>
  <text x="1600" y="900" text-anchor="middle" font-family="Arial, sans-serif" font-size="280" font-weight="700" fill="#FFD700">buzz</text>

  <!-- Separator -->
  <line x1="1050" y1="940" x2="2150" y2="940" stroke="#FFD700" stroke-width="2.5" opacity="0.3"/>

  <!-- Tagline -->
  <text x="1600" y="1005" text-anchor="middle" font-family="Arial, sans-serif" font-size="55" font-weight="400" fill="rgba(255,255,255,0.35)" letter-spacing="12">STORIES · GRAMMAR · FUN</text>

  <!-- Website -->
  <text x="1600" y="1090" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="400" fill="rgba(255,255,255,0.2)">frenchbuzz.ca</text>

  <!-- Subscribe pill (schedule claim removed — no upload day is actually locked yet) -->
  <rect x="1330" y="1130" width="540" height="65" rx="33" fill="#ED2939" opacity="0.85"/>
  <text x="1600" y="1173" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">New episodes weekly</text>

</svg>
