<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>FrenchBuzz Logo - Correct French Flag</title>
  <desc>FrenchBuzz logo with correct French tricolour Blue White Red using vertical stripes clipped to circle</desc>

  <!-- Background -->
  <circle cx="400" cy="400" r="390" fill="#1a1a2e"/>
  <circle cx="400" cy="400" r="375" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.15"/>

  <!-- Ghost FR -->
  <text x="400" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="380" font-weight="700" fill="#ffffff" opacity="0.04">FR</text>

  <!-- French flag circle using clipPath for correct vertical stripes -->
  <defs>
    <clipPath id="flagClip">
      <circle cx="230" cy="340" r="140"/>
    </clipPath>
  </defs>

  <!-- Full white base circle -->
  <circle cx="230" cy="340" r="140" fill="#ffffff"/>

  <!-- Three vertical stripes clipped to circle -->
  <!-- BLUE — left third -->
  <rect x="90" y="200" width="93" height="280" fill="#002395" clip-path="url(#flagClip)"/>
  <!-- WHITE — middle third (already white from base) -->
  <!-- RED — right third -->
  <rect x="277" y="200" width="93" height="280" fill="#ED2939" clip-path="url(#flagClip)"/>

  <!-- Dark centre circle on top -->
  <circle cx="230" cy="340" r="80" fill="#1a1a2e"/>

  <!-- FR text -->
  <text x="230" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="52" font-weight="700" fill="#FFD700">FR</text>

  <!-- Gold spark -->
  <polygon points="555,175 525,270 550,270 518,365 570,255 542,255" fill="#FFD700" opacity="0.95"/>

  <!-- Brand name -->
  <text x="550" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="88" font-weight="700" fill="#ffffff">french</text>
  <text x="550" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="88" font-weight="700" fill="#FFD700">buzz</text>

  <!-- Separator -->
  <line x1="380" y1="448" x2="720" y2="448" stroke="#FFD700" stroke-width="2" opacity="0.3"/>

  <!-- Tagline -->
  <text x="550" y="482" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.35)" letter-spacing="4">STORIES · GRAMMAR · FUN</text>

  <!-- Website -->
  <text x="400" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="rgba(255,255,255,0.2)">frenchbuzz.ca</text>

</svg>
